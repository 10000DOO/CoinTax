name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: macOS unit tests (synthetic only)
    # 배포 타깃이 macOS 15.0 이므로 러너도 15 이상이어야 한다.
    # macos-14 에서는 테스트 호스트 앱(CoinTax.app)이 실행되지 않는다.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # GitHub 러너에는 개발자 인증서가 없다. 서명을 켜두면 빌드 단계에서 바로 실패한다.
      SIGNING_OFF: >-
        CODE_SIGNING_ALLOWED=NO
        CODE_SIGNING_REQUIRED=NO
        CODE_SIGN_IDENTITY=
        CODE_SIGN_ENTITLEMENTS=
        DEVELOPMENT_TEAM=
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i macos || true

      - name: Build for testing
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme CoinTax \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath DerivedData \
            $SIGNING_OFF \
            build-for-testing

      - name: Run CoinTaxTests
        run: |
          set -euo pipefail
          # `test-without-building` 이 출력 없이 종료되는 경우가 있어 xctestrun 을 직접 지정한다.
          run=$(ls DerivedData/Build/Products/*.xctestrun | head -1)
          echo "xctestrun: $run"
          xcodebuild \
            -xctestrun "$run" \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:CoinTaxTests \
            -parallel-testing-enabled NO \
            test-without-building | tee test.log

          # 판정은 **마지막 합계 줄**로만 한다.
          # 개별 스위트 줄에도 "with 0 failures" 가 나오므로 아무 줄이나 grep 하면 실패를 놓친다.
          SUMMARY="$(grep -E "Executed [0-9]+ tests?, with [0-9]+ failures?" test.log | tail -1)"
          if [ -z "$SUMMARY" ]; then
            echo "::error::테스트 결과를 판정할 수 없습니다"
            exit 1
          fi
          echo "$SUMMARY"
          if ! echo "$SUMMARY" | grep -qE "with 0 failures"; then
            echo "::error::단위 테스트 실패"
            grep -E "error:.*-\[CoinTaxTests|^Test Case.*failed" test.log | head -40
            exit 1
          fi

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          if-no-files-found: ignore
